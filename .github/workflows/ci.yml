name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.302

      - name: Restore
        run: dotnet restore ForgeLM.slnx

      - name: Build
        run: dotnet build ForgeLM.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet run --project tests/LLM.Core.Tests --configuration Release --no-build
